[package]
name = "rustron-host"
version = "0.0.1"
edition.workspace = true
license.workspace = true

# No unit tests in src/. Without this, `cargo test` links all of Servo into two extra test
# binaries, which runs the Linux CI runner out of memory.
[lib]
test = false

[[bin]]
name = "rustron-host"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
euclid = "0.22"
http = "1"
percent-encoding = "2"
# Same winit and rustls as servoshell at the pinned Servo rev.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
servo = { git = "https://github.com/servo/servo", rev = "75d20deef", default-features = false, features = ["bundled", "js_jit"] }
url = "2"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
# servoshell enables this on Windows (ANGLE instead of WGL).
servo = { git = "https://github.com/servo/servo", rev = "75d20deef", default-features = false, features = ["no-wgl"] }

[dev-dependencies]
tempfile = "3"
