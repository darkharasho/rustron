[package]
name = "rustron-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
sysinfo = "0.33"
tempfile = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[dev-dependencies]
ureq = "2"
