# Rustron M1 CI: build, test and package on Linux and Windows.
#
# Linux runs on a self-hosted runner (Michael's dev machine, labels self-hosted/Linux/X64/rustron).
# The 16 GB GitHub-hosted Linux runner was lost mid-way through the Servo build on five runs, with
# no logs, even with swap, two jobs, lld and a memory-capped cgroup. The self-hosted machine
# already has Servo's build prerequisites (they were needed for the local Task 4 bench run) and
# keeps its target dir between runs, so no prerequisite or cache steps run for Linux.
#
# The repo is public, so this workflow triggers on push only, never on pull_request: a pull
# request from a fork must not be able to run code on the self-hosted machine.
#
# Windows prerequisites mirror Servo at rev 75d20deef (the libservo pin in crates/rustron-host):
#   - LLVM/clang 20.1 via KyleMayes/install-llvm-action and LIBCLANG_PATH (bin dir), as in Servo's
#     .github/workflows/windows.yml.
#   - python/servo/platform/windows.py + windows/winget.json list CMake, LLVM, Ninja (all
#     preinstalled or installed below) and "moztools" 4.0, which mozjs_sys 153.6.0-2
#     (build.rs find_moztools) locates through MOZTOOLS_PATH. The capi job in windows.yml sets
#     CC/CXX=clang-cl.exe and MOZTOOLS_PATH the same way. WiX and gstreamer are for Servo's own
#     installer and media, not needed here.
#   - Toolchain: rust-toolchain.toml (copy of Servo's, 1.99.1) is honoured by rustup.
#
# Runtime files: rustron-host enables servo's "bundled" feature (-> baked-in-resources), so the
# Servo resources/ directory is compiled into the binary and is NOT shipped in the artifact.
name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: [self-hosted, Linux, X64, rustron]
            name: linux
            exe: ""
          - runs-on: windows-latest
            name: windows
            exe: ".exe"
    steps:
      # No `git clean -ffdx` on the self-hosted runner: it would delete the kept target/ dir.
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.os != 'Linux' }}

      # Servo's tree has WPT/test262 paths longer than MAX_PATH; cargo's git checkout of the
      # servo dependency fails on Windows without long paths enabled.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV

      # Leave cores free on the self-hosted dev machine.
      - name: Limit build jobs (Linux)
        if: runner.os == 'Linux'
        run: echo "CARGO_BUILD_JOBS=12" >> "$GITHUB_ENV"

      - name: Install LLVM and Clang (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm_bin = Join-Path $env:LLVM_PATH "bin"
          "LIBCLANG_PATH=$llvm_bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvm_bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MozTools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same download as python/servo/platform/windows.py (DEPS_URL + moztools-4.0.zip).
          $dest = Join-Path $env:RUNNER_TEMP "moztools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $dest "moztools-4.0.zip"
          Invoke-WebRequest -Uri "https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Join-Path $dest "moztools-4.0"
          if (-not (Test-Path (Join-Path $root "msys2/usr/bin"))) { throw "moztools layout unexpected under $dest" }
          "MOZTOOLS_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # The self-hosted runner keeps target/ in its workspace, so only Windows needs the cache.
      - name: Cache cargo and target (Windows)
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cargo

      - name: Test
        run: cargo test --workspace --release  # release: shares one Servo compile with the build step below

      - name: Build release
        run: cargo build --release -p rustron-host -p rustron-bench

      - name: Collect artifact
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          cp "target/release/rustron-host${{ matrix.exe }}" "target/release/rustron-bench${{ matrix.exe }}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustron-m1-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
